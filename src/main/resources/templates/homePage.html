<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b,
                    #334155
            );
            min-height: 100vh;
            color: white;
        }

        .navbar {
            backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.3) !important;
        }

        .hero {
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            color: white;
            transition: all 0.3s ease;
            border-radius: 20px;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .stats-box {
            background: rgba(255,255,255,0.08);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .btn-custom {
            border-radius: 12px;
            padding: 10px 25px;
        }

        .subtitle {
            color: #cbd5e1;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="@{/}">
            <i class="bi bi-book-half"></i>
            Library System
        </a>
    </div>
</nav>

<div class="container hero">

    <div class="text-center w-100">

        <p class="subtitle mb-1">Created by Artem Kurilov</p>
        <p class="subtitle mb-4">10.06.2026</p>

        <h1 class="display-3 fw-bold mb-3">
            Welcome to Library System
        </h1>

        <p class="lead subtitle mb-5">
            Manage books and students
        </p>

        <div class="row justify-content-center g-4">

            <div class="col-md-4">
                <div class="card shadow-lg h-100">
                    <div class="card-body p-4">

                        <div class="icon">
                            <i class="bi bi-people-fill"></i>
                        </div>

                        <h3>Students</h3>

                        <p class="text-light">
                            Add, edit and manage student records.
                        </p>

                        <a th:href="@{/StudentController/ListOfStudents}"
                           class="btn btn-primary btn-custom">
                            Manage Students
                        </a>

                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-lg h-100">
                    <div class="card-body p-4">

                        <div class="icon">
                            <i class="bi bi-book-fill"></i>
                        </div>

                        <h3>Books</h3>

                        <p class="text-light">
                            Manage library books and inventory.
                        </p>

                        <a th:href="@{/BookController/ListOfBooks}"
                           class="btn btn-success btn-custom">
                            Manage Books
                        </a>

                    </div>
                </div>
            </div>

        </div>

        <div class="row justify-content-center mt-5">

            <div class="col-md-2">
                <div class="stats-box">
                    <h2>150+</h2>
                    <p class="mb-0">Students</p>
                </div>
            </div>

            <div class="col-md-2">
                <div class="stats-box">
                    <h2>500+</h2>
                    <p class="mb-0">Books</p>
                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
